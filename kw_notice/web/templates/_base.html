<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}광운대 공지{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topnav">
    <a href="{{ url_for('notices.index') }}"
       class="{{ 'active' if request.endpoint == 'notices.index' else '' }}">공지</a>
    <a href="{{ url_for('settings.index') }}"
       class="{{ 'active' if request.endpoint and request.endpoint.startswith('settings.') else '' }}">설정</a>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">
        {% for m in messages %}
          <li>{{ error_messages.get(m, m) if error_messages else m }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
